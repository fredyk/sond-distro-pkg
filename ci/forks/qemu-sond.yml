# Modified by the Sond project, 2026-11-26
# Builds the qemu package (qemu-system-x86_64 and qemu-img, what incus 7.6 execs for its VMs:
# driver_qemu.go looks qemu-system-x86_64 up in PATH and runs qemu-img by name; incus requires
# QEMU 8.2 or later, doc/requirements.md) from this fork's sond branch, tag v11.1.3, static
# against the pinned musl, and publishes it to dist.sond.dev, its corresponding source first.
# One target (x86_64-softmmu), KVM only (no TCG), no GUI, no slirp. incus starts every VM with a
# spice section, so spice is enabled. Firmware comes from the edk2-ovmf package; qemu's own
# share/ data (option ROMs, keymaps, bios-256k.bin for CSM) ships under share/qemu.
# Lives in the fork as .github/workflows/sond-package-qemu.yml. Generated from
# fredyk/sond-distro-pkg ci/forks.
# Fork creation, for the operator:
#   secretd-github fork --name qemu-sond https://github.com/qemu/qemu
#   secretd-github branch-create --name sond --sha 005c61c0ef6f6ae615283440b4bb7be51b2c6ddd fredyk/qemu-sond
# then this file pushed to that branch under .github/workflows/.
name: sond package qemu

on:
  push:
    branches: [sond]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq --no-install-recommends meson ninja-build python3-venv bison flex
      - id: build
        uses: fredyk/sond-build-action@v1
        with:
          name: qemu
          version: 11.1.3
          license: GPL-2.0-only AND LGPL-2.1-or-later AND MIT AND BSD-3-Clause
          upstream: github.com/qemu/qemu@005c61c0ef6f6ae615283440b4bb7be51b2c6ddd
          license-files: |
            COPYING
            COPYING.LIB=share/licenses/qemu/LGPL-2.1
            LICENSE=share/licenses/qemu/LICENSE
          depends: |
            linux-headers 6.12.77
            glib 2.86.0
            pixman 0.46.4
            zlib 1.3.1
            spice 0.16.0
          build: |
            # QEMU's documented configure (docs/devel/build-system.rst): --static links every
            # dependency from the sysroot's archives (pkg-config --static). Only what an incus
            # q35 KVM guest uses: no TCG, no user mode, no GUI or audio, no slirp (incus gives
            # VMs tap/macvtap NICs), no docs, no tools but qemu-img.
            CC="$SOND_CC" CFLAGS="$SOND_CFLAGS" LDFLAGS="$SOND_LDFLAGS" \
              ./configure --prefix=/ --datadir=share --static \
                --target-list=x86_64-softmmu --enable-kvm --disable-tcg \
                --disable-user --disable-docs --disable-gtk --disable-sdl --disable-vnc \
                --disable-opengl --disable-slirp --disable-curses --disable-audio \
                --enable-spice --enable-vhost-net --enable-vhost-user --enable-attr \
                --disable-werror --enable-tools --without-default-features
            make -j"$(nproc)" qemu-system-x86_64 qemu-img
            install -D -m 0755 build/qemu-system-x86_64 "$SOND_PAYLOAD/bin/qemu-system-x86_64"
            install -D -m 0755 build/qemu-img "$SOND_PAYLOAD/bin/qemu-img"
            # share/qemu: the option ROMs (efi-virtio.rom and friends), kvmvapic.bin,
            # linuxboot_dma.bin, bios-256k.bin and the keymaps qemu loads at start.
            mkdir -p "$SOND_PAYLOAD/share/qemu/keymaps"
            for f in bios-256k.bin kvmvapic.bin linuxboot_dma.bin multiboot_dma.bin \
              efi-virtio.rom efi-e1000.rom efi-e1000e.rom vgabios-stdvga.bin vgabios-virtio.bin \
              vgabios-qxl.bin; do
              install -m 0644 "pc-bios/$f" "$SOND_PAYLOAD/share/qemu/$f"
            done
            install -m 0644 pc-bios/keymaps/en-us "$SOND_PAYLOAD/share/qemu/keymaps/en-us"
      - uses: fredyk/sond-publish-action@v1
        with:
          bundle: ${{ steps.build.outputs.bundle }}
          source-bundle: ${{ steps.build.outputs.source_bundle }}
          token: ${{ secrets.SOND_PUBLISH_TOKEN }}
          signing-key: ${{ secrets.SOND_SIGNING_KEY }}
