# Builds the ncurses package (static wide-character libraries, headers and
# pkg-config files) from this fork's sond branch against the pinned musl and
# publishes it to dist.sond.dev. Generated from fredyk/sond-distro-pkg ci/forks.
name: sond package

on:
  push:
    branches: [sond]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: build
        uses: fredyk/sond-build-action@v1
        with:
          name: ncurses
          version: 6.6
          license: X11-distribute-modifications-variant
          upstream: github.com/ThomasDickey/ncurses-snapshots@0096bd402c4a9c8f39bd7ed266e1b8920327e4d8
          license-files: |
            COPYING
          build: |
            # The compiled-in fallbacks are generated by tic and infocmp from this
            # tree's misc/terminfo.src; both tools are built from the same tree so
            # the result does not depend on the runner's ncurses.
            mkdir -p build-host
            (cd build-host && ../configure --without-shared --without-cxx \
              --without-cxx-binding --without-ada --without-manpages --without-tests \
              --enable-widec --disable-db-install >/dev/null &&
              make -j"$(nproc)" -C include >/dev/null &&
              make -j"$(nproc)" -C ncurses >/dev/null &&
              make -j"$(nproc)" -C progs tic infocmp >/dev/null)
            ./configure --prefix=/ --without-shared --with-normal --without-debug \
              --without-cxx --without-cxx-binding --without-ada --without-manpages \
              --without-progs --without-tests --enable-widec --with-termlib \
              --enable-pc-files --with-pkg-config-libdir=/lib/pkgconfig \
              --disable-db-install --with-default-terminfo-dir=/share/terminfo \
              --with-terminfo-dirs=/share/terminfo:/usr/share/terminfo:/lib/terminfo:/etc/terminfo \
              --with-fallbacks=linux,vt100,vt220,xterm,xterm-256color,screen,screen-256color,tmux,tmux-256color,rxvt \
              --with-tic-path="$PWD/build-host/progs/tic" \
              --with-infocmp-path="$PWD/build-host/progs/infocmp" \
              CC="$SOND_CC" CFLAGS="$SOND_CFLAGS" LDFLAGS="$SOND_LDFLAGS -static"
            make -j"$(nproc)"
            make install DESTDIR="$SOND_PAYLOAD"
      - uses: fredyk/sond-publish-action@v1
        with:
          bundle: ${{ steps.build.outputs.bundle }}
          token: ${{ secrets.SOND_PUBLISH_TOKEN }}
          signing-key: ${{ secrets.SOND_SIGNING_KEY }}
