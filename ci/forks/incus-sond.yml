# Modified by the Sond project, 2026-11-21
# Builds the incus package (the incus client: pure Go, CGO_ENABLED=0, no libc)
# from this fork's sond branch with the pinned Go toolchain and publishes it to
# dist.sond.dev. Generated from fredyk/sond-distro-pkg ci/forks.
name: sond package

on:
  push:
    branches: [sond]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: false
      - id: build
        uses: fredyk/sond-build-action@v1
        with:
          name: incus
          version: 7.6.0-sond1
          license: Apache-2.0
          upstream: github.com/lxc/incus@8f5e6c2235f6424ec59d3dc06f12e344a4a416e2
          linkage: static Go, no libc
          license-files: |
            COPYING
          build: |
            # The client only (licence opinion 2.10 (a)): without cgo no C file of the tree, and
            # none of its LGPL or GPL headers in shared/cgo, is compiled in. The toolchain is the
            # one setup-go pinned; modules come from go.sum.
            mkdir -p "$SOND_PAYLOAD/bin"
            CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid=" -o "$SOND_PAYLOAD/bin/incus" ./cmd/incus
      - uses: fredyk/sond-publish-action@v1
        with:
          bundle: ${{ steps.build.outputs.bundle }}
          token: ${{ secrets.SOND_PUBLISH_TOKEN }}
          signing-key: ${{ secrets.SOND_SIGNING_KEY }}
