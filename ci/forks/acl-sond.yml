# Modified by the Sond project, 2026-11-21
# Builds the acl package (a static library, no program) from this fork's
# sond branch against the pinned musl and publishes it to dist.sond.dev, its corresponding source first.
# Generated from fredyk/sond-distro-pkg ci/forks.
name: sond package

on:
  push:
    branches: [sond]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y -qq --no-install-recommends autopoint gettext
      - id: build
        uses: fredyk/sond-build-action@v1
        with:
          name: acl
          version: 2.4.0
          license: LGPL-2.1-or-later
          upstream: git.savannah.gnu.org/r/acl@3589787cd589b34bdd9265936e17190b6d3f17d1
          license-files: |
            doc/COPYING.LGPL=share/licenses/acl/LGPL-2.1
            doc/COPYING
          depends: |
            attr 2.6.0
            linux-headers 6.12.77
          build: |
            # libacl only: the GPL-2.0 tools (getfacl, setfacl, chacl) are not built (licence opinion,
            # incusd table). libacl reads extended attributes through the C library;
            # from attr it takes only the error_context.h header.
            ./autogen.sh
            ./configure --prefix=/ --disable-shared --enable-static --disable-nls \
              CC="$SOND_CC" CFLAGS="$SOND_CFLAGS" LDFLAGS="$SOND_LDFLAGS -static"
            make -j"$(nproc)" libacl.la
            make DESTDIR="$SOND_PAYLOAD" install-libLTLIBRARIES install-pkgconfDATA \
              install-data-local
            rm -f "$SOND_PAYLOAD"/lib/*.la
      - uses: fredyk/sond-publish-action@v1
        with:
          bundle: ${{ steps.build.outputs.bundle }}
          source-bundle: ${{ steps.build.outputs.source_bundle }}
          token: ${{ secrets.SOND_PUBLISH_TOKEN }}
          signing-key: ${{ secrets.SOND_SIGNING_KEY }}
