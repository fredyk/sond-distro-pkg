# Modified by the Sond project, 2026-11-26
# Builds the zlib package (a static library for a static musl qemu) from this fork's sond
# branch against the pinned musl and publishes it to dist.sond.dev. Ships lib/libz.a, the two
# public headers and lib/pkgconfig/zlib.pc only: no shared object, no manual page, no
# example programs. zlib is under the Zlib licence. Lives in the fork as
# .github/workflows/sond-package-zlib.yml. Generated from fredyk/sond-distro-pkg ci/forks.
# Fork creation, for the operator:
#   secretd-github fork --name zlib-sond https://github.com/madler/zlib
#   secretd-github branch-create --name sond --sha da607da739fa6047df13e66a2af6b8bec7c2a498 fredyk/zlib-sond
# then this file pushed to that branch under .github/workflows/.
name: sond package zlib

on:
  push:
    branches: [sond]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: build
        uses: fredyk/sond-build-action@v1
        with:
          name: zlib
          version: 1.3.2
          license: Zlib
          upstream: github.com/madler/zlib@da607da739fa6047df13e66a2af6b8bec7c2a498
          license-files: |
            LICENSE
          build: |
            # --static leaves SHAREDLIBV empty, so no libz.so is built; configure writes zlib.pc.
            # Only the libz.a target is made, and the four files are installed by hand because
            # the upstream install-libs target also installs the manual page.
            CC="$SOND_CC" CFLAGS="$SOND_CFLAGS" LDFLAGS="$SOND_LDFLAGS -static" \
              ./configure --prefix=/ --static
            make -j"$(nproc)" libz.a
            install -D -m 0644 libz.a "$SOND_PAYLOAD/lib/libz.a"
            install -D -m 0644 zlib.h "$SOND_PAYLOAD/include/zlib.h"
            install -D -m 0644 zconf.h "$SOND_PAYLOAD/include/zconf.h"
            install -D -m 0644 zlib.pc "$SOND_PAYLOAD/lib/pkgconfig/zlib.pc"
      - uses: fredyk/sond-publish-action@v1
        with:
          bundle: ${{ steps.build.outputs.bundle }}
          source-bundle: ${{ steps.build.outputs.source_bundle }}
          token: ${{ secrets.SOND_PUBLISH_TOKEN }}
          signing-key: ${{ secrets.SOND_SIGNING_KEY }}
